# Copy to config.yaml. The OpenRouter key is NOT stored here.
# It goes in the OS keychain via the dashboard.

hotkeys:
  # One key drives dictation. Hold it to speak; double-tap to latch so you can
  # pause and keep going; tap once more to stop.
  #
  # This is a key name, not an accelerator, because a bare modifier cannot be
  # registered as a global hotkey on macOS at all. It is watched instead of
  # registered, which also means it keeps working as a normal Command key.
  # Supported: RightCommand, LeftCommand, RightOption.
  dictate_key: "RightCommand"
  latch_ms: 350                # a second tap within this window latches
  # Read-aloud is a watched key too: tap once to start reading the selection,
  # tap again to stop. Supported: RightCommand, LeftCommand, RightOption.
  # It must not be the same key as dictate_key.
  read_aloud_key: "RightOption"
  # Vestigial. Read-aloud used to be this accelerator; it is a watched key now.
  read_aloud: "CmdOrCtrl+Shift+R"
  stop: "Escape"

transcription:
  base_url: "https://openrouter.ai/api/v1"
  model: "deepgram/nova-3"
  # alternatives:
  #   nvidia/parakeet-tdt-0.6b-v3   faster, EU-focused languages
  #   openai/whisper-large-v3       slower, best on accented + technical speech
  #   microsoft/mai-transcribe-2    60 languages, code switching
  language: "en"
  timeout_ms: 15000

chunking:
  pause_threshold_ms: 450      # silence that closes a chunk
  overlap_ms: 200              # carried into next chunk so words aren't lost
  min_chunk_ms: 600            # ignore segments shorter than this
  max_chunk_ms: 25000          # force-close before the 60s upstream timeout

audio:
  codec: "opus"
  bitrate: 24000
  sample_rate: 16000
  channels: 1

cleanup:
  enabled: true                # false pastes the raw transcript, unpolished
  base_url: "https://openrouter.ai/api/v1"
  model: "anthropic/claude-haiku-4.5"
  speculative: true            # fire on last pause, re-fire if final chunk differs
  max_tokens: 1024
  offline_behavior: "paste_raw"   # paste_raw | queue

tts:
  first_sentence:
    engine: "kokoro"
    voice: "af_heart"
  # Kokoro is the only implemented engine. "chatterbox-turbo" still parses, but
  # nothing implements it: measured at ~2.1s of compute per spoken second, which
  # is slower than the speech it produces. See CLAUDE.md step 7.
  main:
    engine: "kokoro"
    voice: "af_heart"
    exaggeration: 0.45
  speed: 1.2
  # Vestigial: there is one engine, so there is no handoff to schedule. The key
  # is kept because removing it would break existing config.yaml files, which
  # have no default for it.
  handoff_after_sentences: 1
  skip_code_blocks: true
  skip_urls: true
  expand_numbers: true

pronunciation:
  - match: "API"
    say: "ay pee eye"
  - match: "₦"
    say: "naira"
  - match: "Naxcrow"
    say: "nax crow"

dictionary:
  # Put the words *you* say here. These entries are examples, not defaults
  # worth keeping — a dictionary full of someone else's vocabulary does
  # nothing for yours.
  #
  # Each term works twice. The first `prompt_budget` terms are sent with the
  # audio to bias transcription, and every `sounds_like` variant is handed to
  # the cleanup model as an explicit correction, so a word that slips past the
  # first still gets fixed by the second.
  #
  # `sounds_like` is what transcription produced *instead* of the term. Read
  # the History screen after a few dictations: whatever it got wrong belongs
  # here. Real example from this project — "Mac" came back as "Mark", so
  # `- term: "Mac"` with `sounds_like: ["Mark"]` fixed it.
  prompt_budget: 40            # top N terms biased into the transcription prompt
  terms:
    - term: "Naxcrow"
      sounds_like: ["nax crow", "nacro"]
    - term: "Paystack"
      sounds_like: ["pay stack"]
    - term: "Flutterwave"
      sounds_like: ["flutter wave"]
    - term: "idempotency"
      sounds_like: ["idempotancy"]

profiles:
  default:
    prompt: >
      Remove filler words and false starts. Fix grammar and punctuation.


      Dictation mishears words. Where a word is clearly wrong and the intended
      word is obvious from the surrounding sentence, correct it: "app tree" is
      "app tray", "four loop" is "for loop". Correct only what the context makes
      unambiguous. If you are not sure, leave the word alone, because a wrong
      correction is worse than a wrong transcription: the speaker can no longer
      tell what they said.


      Keep the speaker's voice, phrasing and vocabulary. Do not add or invent
      content, and do not rewrite sentences that are merely informal.

  "Code|Code.exe|cursor":
    prompt: >
      Technical dictation. Never alter identifiers, file paths, package names or
      case. Format code as code. No pleasantries, no restating the request.


      Dictation mishears ordinary words. Where a word is clearly wrong and the
      intended word is obvious from the surrounding sentence, correct it: "app
      tree" is "app tray", "four loop" is "for loop". This applies to prose
      only. Never guess at an identifier, file path, package name, command or
      anything written as code, however odd it looks: those are far more likely
      to be exactly what was said. If you are not sure, leave the word alone,
      because a wrong correction is worse than a wrong transcription: the
      speaker can no longer tell what they said.
    strip_fillers: true
    auto_capitalize: false

  "mail.google.com|Mail|Outlook":
    prompt: >
      Professional email. Structure into short paragraphs. Turn spoken lists into
      bullets. Keep it direct.

  "WhatsApp|Telegram|Messages":
    prompt: >
      Casual message. Keep it short. No corporate tone, no sign-off.

  "upwork.com":
    prompt: >
      Client-facing proposal voice. Direct, specific, no filler adjectives.
      Never invent metrics, figures or past results.

telemetry:
  enabled: false

history:
  # Keeps each dictation on disk so the History screen has something to show,
  # and so Status can report a round-trip median and a word count. This writes
  # what you dictated, in plain text, to the app data directory. Set false and
  # nothing is recorded.
  keep: true
